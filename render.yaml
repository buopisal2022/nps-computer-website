services:
  - type: web
    name: nps-computer-auth
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/buopisal2022/nps-computer-website
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nps-computer-auth-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
